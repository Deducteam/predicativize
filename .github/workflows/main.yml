on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test_compile:
    strategy:
      fail-fast: false
      matrix:
        ocaml-version: [5.4.1, 5.3.0, 5.2.1, 4.14.2]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup-ocaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
      - name: install dependencies
        run: |
          opam pin add -n -k path predicativize .
          opam install --deps-only -d -t predicativize
      - name: build
        run: |
          eval $(opam env)
          dune build
